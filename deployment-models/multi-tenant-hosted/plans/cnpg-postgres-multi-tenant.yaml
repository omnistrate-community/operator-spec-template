# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
#
# CNPG Postgres Multi-Tenant (hosted, AWS, Dev)
# Adapted from omnistrate-community/operator-spec-template spec.yaml.
#
# Tenancy model: every tenant instance lives in its own namespace ($sys.namespace)
# of a shared hosted deployment cell. Each create/restore/modify applies, per namespace:
#   - NetworkPolicy tenant-isolation  (deny cross-namespace traffic by default)
#   - ResourceQuota tenant-quota and LimitRange tenant-limits
#   - per-tenant Secrets (app role, S3 credentials)
# Volumes use the encrypted gp3 StorageClass cnpg-gp3-encrypted; backups to S3
# use SSE (AES256); clients must connect over TLS (hostnossl rejected).
name: CNPG Postgres Multi-Tenant
tenancyType: CUSTOM_TENANCY
deployment:
  hostedDeployment:
    awsAccountId: "123456789012" # your Omnistrate control plane AWS account ID
    awsBootstrapRoleAccountArn: "arn:aws:iam::123456789012:role/omnistrate-bootstrap-role"
features:
  INTERNAL:
    logs:
  CUSTOMER:
    logs:

services:
  - name: CNPG
    description: Managed PostgreSQL cluster (CloudNativePG) in an isolated tenant namespace.
    compute:
      instanceTypes:
        - name: m6i.xlarge
          cloudProvider: aws
    apiParameters:
      - key: postgresqlUsername
        description: Application role that owns the default database
        name: Default DB Username
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "app"
      - key: postgresqlPassword
        description: Password of the application role (stored only as a Kubernetes Secret in the tenant namespace)
        name: Password
        type: Password
        modifiable: false
        required: true
        export: false
      - key: postgresqlDatabase
        description: Default database name
        name: Default Database Name
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "app"
      - key: numberOfInstances
        description: Postgres members (1 primary plus replicas). Change it with modify to scale.
        name: Number of Members
        type: Float64
        modifiable: true
        required: false
        export: true
        defaultValue: "1"
        limits:
          min: 1
          max: 5
      - key: storageSizeGi
        description: Data volume size per member in GiB. Can only grow; change it with modify.
        name: Storage Size (GiB)
        type: Float64
        modifiable: true
        required: false
        export: true
        defaultValue: "20"
        limits:
          min: 10
          max: 500
      - key: cpuPerMember
        description: CPU request and limit per Postgres member
        name: CPU per Member
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: "1"
        options:
          - "500m"
          - "1"
          - "2"
      - key: memoryPerMember
        description: Memory request and limit per Postgres member
        name: Memory per Member
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: "2Gi"
        options:
          - "1Gi"
          - "2Gi"
          - "4Gi"
          - "8Gi"
      - key: backupS3BucketName
        description: S3 bucket for Barman Cloud backups and WAL archive
        name: Backup S3 Bucket Name
        type: String
        modifiable: true
        required: true
        export: true
      - key: backupS3BucketRegion
        description: AWS region of the backup bucket
        name: Backup S3 Bucket Region
        type: String
        modifiable: true
        required: true
        export: true
      - key: backupS3AccessKeyId
        description: Access key ID with read/write access to the backup bucket prefix
        name: Backup S3 Access Key ID
        type: String
        modifiable: true
        required: true
        export: false
      - key: backupS3SecretAccessKey
        description: Secret access key for the backup bucket (stored only as a Kubernetes Secret)
        name: Backup S3 Secret Access Key
        type: Password
        modifiable: true
        required: true
        export: false
    endpointConfiguration:
      writer:
        host: "$sys.network.externalClusterEndpoint"
        ports:
          - 5432
        primary: true
        networkingType: PUBLIC
      reader:
        host: "reader-{{ $sys.network.externalClusterEndpoint }}"
        ports:
          - 5432
        primary: false
        networkingType: PUBLIC

    operatorCRDConfiguration:
      # Operator charts install once per deployment cell (cluster-scoped CNPG, CRDs included).
      # Kept from the template so a fresh cell works without manual setup; see the design's
      # planned item to move these to a deployment-cell amenity.
      helmChartDependencies:
        - chartName: cloudnative-pg
          chartVersion: 0.28.2
          chartRepoName: cnpg
          chartRepoURL: https://cloudnative-pg.github.io/charts
        - chartName: plugin-barman-cloud
          chartVersion: 0.6.0
          chartRepoName: cnpg
          chartRepoURL: https://cloudnative-pg.github.io/charts

    capabilities:
      backupConfiguration:
        backupRetentionInDays: 7
        backupPeriodInHours: 24
        snapshotBeforeDeletion: true

    systemWorkflows:

      # ------------------------------------------------------------------ create
      create:
        outputParameters:
          postgresContainerImage: "$tasks.applycluster.resource.status.image"
          status: "$tasks.applycluster.resource.status.phase"
          currentPrimary: "$tasks.applycluster.resource.status.currentPrimary"
          readyInstances: "$tasks.applycluster.resource.status.readyInstances"
        workflow:
          entrypoint: create
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: postgresqlUsername
                value: "{{ $var.postgresqlUsername }}"
              - name: postgresqlDatabase
                value: "{{ $var.postgresqlDatabase }}"
              - name: postgresqlUsernameEncoded
                value: "{{ $func.base64encode($var.postgresqlUsername) }}"
              - name: postgresqlPasswordEncoded
                value: "{{ $func.base64encode($var.postgresqlPassword) }}"
              - name: backupS3BucketName
                value: "{{ $var.backupS3BucketName }}"
              - name: backupS3BucketRegionEncoded
                value: "{{ $func.base64encode($var.backupS3BucketRegion) }}"
              - name: backupS3AccessKeyIdEncoded
                value: "{{ $func.base64encode($var.backupS3AccessKeyId) }}"
              - name: backupS3SecretAccessKeyEncoded
                value: "{{ $func.base64encode($var.backupS3SecretAccessKey) }}"
              - name: numberOfInstances
                value: "{{ $var.numberOfInstances }}"
              - name: storageSizeGi
                value: "{{ $var.storageSizeGi }}"
              - name: cpuPerMember
                value: "{{ $var.cpuPerMember }}"
              - name: memoryPerMember
                value: "{{ $var.memoryPerMember }}"
              - name: externalClusterEndpoint
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $sys.compute.node.instanceType }}"
              - name: resourceId
                value: "{{ $sys.deployment.resourceID }}"
              - name: publicSubnetIds
                value: "{{ $sys.deploymentCell.publicSubnetIDs[*].id }}"
          templates:
            - name: create
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: postgresqlUsernameEncoded
                  - name: postgresqlPasswordEncoded
                  - name: backupS3BucketName
                  - name: backupS3BucketRegionEncoded
                  - name: backupS3AccessKeyIdEncoded
                  - name: backupS3SecretAccessKeyEncoded
                  - name: numberOfInstances
                  - name: storageSizeGi
                  - name: cpuPerMember
                  - name: memoryPerMember
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              dag:
                tasks:
                  - name: applystorageclass
                    template: apply-storage-class
                  - name: applynetworkpolicy
                    template: apply-network-policy
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: applyquota
                    template: apply-resource-quota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: applylimitrange
                    template: apply-limit-range
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: createsecret
                    template: apply-secret
                    dependencies:
                      - applyquota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: postgresqlUsernameEncoded
                          value: "{{inputs.parameters.postgresqlUsernameEncoded}}"
                        - name: postgresqlPasswordEncoded
                          value: "{{inputs.parameters.postgresqlPasswordEncoded}}"
                  - name: createbackupsecret
                    template: apply-backup-secret
                    dependencies:
                      - applyquota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: clusterName
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupS3AccessKeyIdEncoded
                          value: "{{inputs.parameters.backupS3AccessKeyIdEncoded}}"
                        - name: backupS3SecretAccessKeyEncoded
                          value: "{{inputs.parameters.backupS3SecretAccessKeyEncoded}}"
                        - name: backupS3BucketRegionEncoded
                          value: "{{inputs.parameters.backupS3BucketRegionEncoded}}"
                  - name: createobjectstore
                    template: apply-object-store
                    dependencies:
                      - createbackupsecret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: clusterName
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupS3BucketName
                          value: "{{inputs.parameters.backupS3BucketName}}"
                  - name: applycluster
                    template: apply-cluster
                    dependencies:
                      - applystorageclass
                      - applynetworkpolicy
                      - applylimitrange
                      - createsecret
                      - createobjectstore
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: postgresqlUsername
                          value: "{{inputs.parameters.postgresqlUsername}}"
                        - name: postgresqlDatabase
                          value: "{{inputs.parameters.postgresqlDatabase}}"
                        - name: numberOfInstances
                          value: "{{inputs.parameters.numberOfInstances}}"
                        - name: storageSizeGi
                          value: "{{inputs.parameters.storageSizeGi}}"
                        - name: cpuPerMember
                          value: "{{inputs.parameters.cpuPerMember}}"
                        - name: memoryPerMember
                          value: "{{inputs.parameters.memoryPerMember}}"
                        - name: externalClusterEndpoint
                          value: "{{inputs.parameters.externalClusterEndpoint}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: resourceId
                          value: "{{inputs.parameters.resourceId}}"
                        - name: publicSubnetIds
                          value: "{{inputs.parameters.publicSubnetIds}}"
            - name: apply-storage-class
              resource:
                action: apply
                manifest: |
                  apiVersion: storage.k8s.io/v1
                  kind: StorageClass
                  metadata:
                    name: cnpg-gp3-encrypted
                  provisioner: ebs.csi.aws.com
                  parameters:
                    type: gp3
                    encrypted: "true"
                    csi.storage.k8s.io/fstype: ext4
                  allowVolumeExpansion: true
                  reclaimPolicy: Delete
                  volumeBindingMode: WaitForFirstConsumer
            - name: apply-network-policy
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: tenant-isolation
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    podSelector: {}
                    policyTypes:
                      - Ingress
                      - Egress
                    ingress:
                      - from:
                          - podSelector: {}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: cnpg-system
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: observability-ns
                        ports:
                          - protocol: TCP
                            port: 9187
                      - from:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                        ports:
                          - protocol: TCP
                            port: 5432
                    egress:
                      - to:
                          - podSelector: {}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                        ports:
                          - protocol: UDP
                            port: 53
                          - protocol: TCP
                            port: 53
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: cnpg-system
                      - to:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                        ports:
                          - protocol: TCP
                            port: 443
            - name: apply-resource-quota
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    hard:
                      requests.cpu: "16"
                      limits.cpu: "16"
                      requests.memory: 48Gi
                      limits.memory: 48Gi
                      requests.storage: 3000Gi
                      persistentvolumeclaims: "12"
                      pods: "20"
                      services: "10"
                      services.loadbalancers: "2"
                      services.nodeports: "4"
                      secrets: "60"
                      configmaps: "30"
            - name: apply-limit-range
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: 500m
                          memory: 512Mi
                        defaultRequest:
                          cpu: 100m
                          memory: 128Mi
                        max:
                          cpu: "2"
                          memory: 8Gi
                      - type: PersistentVolumeClaim
                        min:
                          storage: 1Gi
                        max:
                          storage: 500Gi
            - name: apply-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: postgresqlUsernameEncoded
                  - name: postgresqlPasswordEncoded
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: basic-auth
                    namespace: "{{inputs.parameters.namespace}}"
                  type: kubernetes.io/basic-auth
                  data:
                    username: "{{inputs.parameters.postgresqlUsernameEncoded}}"
                    password: "{{inputs.parameters.postgresqlPasswordEncoded}}"
            - name: apply-backup-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: clusterName
                  - name: backupS3AccessKeyIdEncoded
                  - name: backupS3SecretAccessKeyEncoded
                  - name: backupS3BucketRegionEncoded
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.clusterName}}-s3-credentials"
                    namespace: "{{inputs.parameters.namespace}}"
                  type: Opaque
                  data:
                    ACCESS_KEY_ID: "{{inputs.parameters.backupS3AccessKeyIdEncoded}}"
                    ACCESS_SECRET_KEY: "{{inputs.parameters.backupS3SecretAccessKeyEncoded}}"
                    REGION: "{{inputs.parameters.backupS3BucketRegionEncoded}}"
            - name: apply-object-store
              inputs:
                parameters:
                  - name: namespace
                  - name: clusterName
                  - name: backupS3BucketName
              resource:
                action: apply
                manifest: |
                  apiVersion: barmancloud.cnpg.io/v1
                  kind: ObjectStore
                  metadata:
                    name: "{{inputs.parameters.clusterName}}-s3"
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    retentionPolicy: "14d"
                    configuration:
                      destinationPath: "s3://{{inputs.parameters.backupS3BucketName}}/{{inputs.parameters.clusterName}}"
                      s3Credentials:
                        accessKeyId:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: ACCESS_KEY_ID
                        secretAccessKey:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: ACCESS_SECRET_KEY
                        region:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: REGION
                      data:
                        compression: gzip
                        encryption: AES256
                      wal:
                        compression: gzip
                        encryption: AES256
                        maxParallel: 8
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: numberOfInstances
                  - name: storageSizeGi
                  - name: cpuPerMember
                  - name: memoryPerMember
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              resource:
                action: apply
                successCondition: status.instances == {{inputs.parameters.numberOfInstances}}, status.readyInstances == {{inputs.parameters.numberOfInstances}}
                failureCondition: status.phase == failed
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      cnpg.io/hibernation: "off"
                  spec:
                    instances: {{inputs.parameters.numberOfInstances}}
                    enablePDB: true
                    enableSuperuserAccess: false
                    plugins:
                      - name: barman-cloud.cloudnative-pg.io
                        parameters:
                          barmanObjectName: "{{inputs.parameters.instanceId}}-s3"
                    bootstrap:
                      initdb:
                        owner: "{{inputs.parameters.postgresqlUsername}}"
                        database: "{{inputs.parameters.postgresqlDatabase}}"
                        secret:
                          name: basic-auth
                    postgresql:
                      pg_hba:
                        - hostnossl all all 0.0.0.0/0 reject
                        - hostnossl all all ::/0 reject
                    resources:
                      requests:
                        cpu: "{{inputs.parameters.cpuPerMember}}"
                        memory: "{{inputs.parameters.memoryPerMember}}"
                      limits:
                        cpu: "{{inputs.parameters.cpuPerMember}}"
                        memory: "{{inputs.parameters.memoryPerMember}}"
                    storage:
                      resizeInUseVolumes: true
                      size: "{{inputs.parameters.storageSizeGi}}Gi"
                      storageClass: cnpg-gp3-encrypted
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                              - key: omnistrate.com/managed-by
                                operator: In
                                values:
                                - omnistrate
                              - key: topology.kubernetes.io/region
                                operator: In
                                values:
                                - "{{inputs.parameters.region}}"
                              - key: node.kubernetes.io/instance-type
                                operator: In
                                values:
                                - "{{inputs.parameters.instanceType}}"
                              - key: omnistrate.com/resource
                                operator: In
                                values:
                                - "{{inputs.parameters.resourceId}}"
                    managed:
                      services:
                        additional:
                          - selectorType: ro
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-ro"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "reader-{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch
                          - selectorType: rw
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-rw"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch

      # ------------------------------------------------------------------ modify (update, scale members, CPU/memory, storage)
      modify:
        outputParameters:
          postgresContainerImage: "$tasks.applycluster.resource.status.image"
          status: "$tasks.applycluster.resource.status.phase"
          currentPrimary: "$tasks.applycluster.resource.status.currentPrimary"
          readyInstances: "$tasks.applycluster.resource.status.readyInstances"
        workflow:
          entrypoint: update
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: postgresqlUsername
                value: "{{ $var.postgresqlUsername }}"
              - name: postgresqlDatabase
                value: "{{ $var.postgresqlDatabase }}"
              - name: backupS3BucketName
                value: "{{ $var.backupS3BucketName }}"
              - name: backupS3BucketRegionEncoded
                value: "{{ $func.base64encode($var.backupS3BucketRegion) }}"
              - name: backupS3AccessKeyIdEncoded
                value: "{{ $func.base64encode($var.backupS3AccessKeyId) }}"
              - name: backupS3SecretAccessKeyEncoded
                value: "{{ $func.base64encode($var.backupS3SecretAccessKey) }}"
              - name: numberOfInstances
                value: "{{ $var.numberOfInstances }}"
              - name: storageSizeGi
                value: "{{ $var.storageSizeGi }}"
              - name: cpuPerMember
                value: "{{ $var.cpuPerMember }}"
              - name: memoryPerMember
                value: "{{ $var.memoryPerMember }}"
              - name: externalClusterEndpoint
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $sys.compute.node.instanceType }}"
              - name: resourceId
                value: "{{ $sys.deployment.resourceID }}"
              - name: publicSubnetIds
                value: "{{ $sys.deploymentCell.publicSubnetIDs[*].id }}"
          templates:
            - name: update
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: backupS3BucketName
                  - name: backupS3BucketRegionEncoded
                  - name: backupS3AccessKeyIdEncoded
                  - name: backupS3SecretAccessKeyEncoded
                  - name: numberOfInstances
                  - name: storageSizeGi
                  - name: cpuPerMember
                  - name: memoryPerMember
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              dag:
                tasks:
                  - name: applynetworkpolicy
                    template: apply-network-policy
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: applyquota
                    template: apply-resource-quota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: applylimitrange
                    template: apply-limit-range
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: createbackupsecret
                    template: apply-backup-secret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: clusterName
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupS3AccessKeyIdEncoded
                          value: "{{inputs.parameters.backupS3AccessKeyIdEncoded}}"
                        - name: backupS3SecretAccessKeyEncoded
                          value: "{{inputs.parameters.backupS3SecretAccessKeyEncoded}}"
                        - name: backupS3BucketRegionEncoded
                          value: "{{inputs.parameters.backupS3BucketRegionEncoded}}"
                  - name: createobjectstore
                    template: apply-object-store
                    dependencies:
                      - createbackupsecret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: clusterName
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupS3BucketName
                          value: "{{inputs.parameters.backupS3BucketName}}"
                  - name: applycluster
                    template: apply-cluster
                    dependencies:
                      - applynetworkpolicy
                      - applyquota
                      - applylimitrange
                      - createobjectstore
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: postgresqlUsername
                          value: "{{inputs.parameters.postgresqlUsername}}"
                        - name: postgresqlDatabase
                          value: "{{inputs.parameters.postgresqlDatabase}}"
                        - name: numberOfInstances
                          value: "{{inputs.parameters.numberOfInstances}}"
                        - name: storageSizeGi
                          value: "{{inputs.parameters.storageSizeGi}}"
                        - name: cpuPerMember
                          value: "{{inputs.parameters.cpuPerMember}}"
                        - name: memoryPerMember
                          value: "{{inputs.parameters.memoryPerMember}}"
                        - name: externalClusterEndpoint
                          value: "{{inputs.parameters.externalClusterEndpoint}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: resourceId
                          value: "{{inputs.parameters.resourceId}}"
                        - name: publicSubnetIds
                          value: "{{inputs.parameters.publicSubnetIds}}"
            - name: apply-network-policy
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: tenant-isolation
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    podSelector: {}
                    policyTypes:
                      - Ingress
                      - Egress
                    ingress:
                      - from:
                          - podSelector: {}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: cnpg-system
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: observability-ns
                        ports:
                          - protocol: TCP
                            port: 9187
                      - from:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                        ports:
                          - protocol: TCP
                            port: 5432
                    egress:
                      - to:
                          - podSelector: {}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                        ports:
                          - protocol: UDP
                            port: 53
                          - protocol: TCP
                            port: 53
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: cnpg-system
                      - to:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                        ports:
                          - protocol: TCP
                            port: 443
            - name: apply-resource-quota
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    hard:
                      requests.cpu: "16"
                      limits.cpu: "16"
                      requests.memory: 48Gi
                      limits.memory: 48Gi
                      requests.storage: 3000Gi
                      persistentvolumeclaims: "12"
                      pods: "20"
                      services: "10"
                      services.loadbalancers: "2"
                      services.nodeports: "4"
                      secrets: "60"
                      configmaps: "30"
            - name: apply-limit-range
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: 500m
                          memory: 512Mi
                        defaultRequest:
                          cpu: 100m
                          memory: 128Mi
                        max:
                          cpu: "2"
                          memory: 8Gi
                      - type: PersistentVolumeClaim
                        min:
                          storage: 1Gi
                        max:
                          storage: 500Gi
            - name: apply-backup-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: clusterName
                  - name: backupS3AccessKeyIdEncoded
                  - name: backupS3SecretAccessKeyEncoded
                  - name: backupS3BucketRegionEncoded
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.clusterName}}-s3-credentials"
                    namespace: "{{inputs.parameters.namespace}}"
                  type: Opaque
                  data:
                    ACCESS_KEY_ID: "{{inputs.parameters.backupS3AccessKeyIdEncoded}}"
                    ACCESS_SECRET_KEY: "{{inputs.parameters.backupS3SecretAccessKeyEncoded}}"
                    REGION: "{{inputs.parameters.backupS3BucketRegionEncoded}}"
            - name: apply-object-store
              inputs:
                parameters:
                  - name: namespace
                  - name: clusterName
                  - name: backupS3BucketName
              resource:
                action: apply
                manifest: |
                  apiVersion: barmancloud.cnpg.io/v1
                  kind: ObjectStore
                  metadata:
                    name: "{{inputs.parameters.clusterName}}-s3"
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    retentionPolicy: "14d"
                    configuration:
                      destinationPath: "s3://{{inputs.parameters.backupS3BucketName}}/{{inputs.parameters.clusterName}}"
                      s3Credentials:
                        accessKeyId:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: ACCESS_KEY_ID
                        secretAccessKey:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: ACCESS_SECRET_KEY
                        region:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: REGION
                      data:
                        compression: gzip
                        encryption: AES256
                      wal:
                        compression: gzip
                        encryption: AES256
                        maxParallel: 8
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: numberOfInstances
                  - name: storageSizeGi
                  - name: cpuPerMember
                  - name: memoryPerMember
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              resource:
                action: apply
                successCondition: status.instances == {{inputs.parameters.numberOfInstances}}, status.readyInstances == {{inputs.parameters.numberOfInstances}}
                failureCondition: status.phase == failed
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      cnpg.io/hibernation: "off"
                  spec:
                    instances: {{inputs.parameters.numberOfInstances}}
                    enablePDB: true
                    enableSuperuserAccess: false
                    plugins:
                      - name: barman-cloud.cloudnative-pg.io
                        parameters:
                          barmanObjectName: "{{inputs.parameters.instanceId}}-s3"
                    bootstrap:
                      initdb:
                        owner: "{{inputs.parameters.postgresqlUsername}}"
                        database: "{{inputs.parameters.postgresqlDatabase}}"
                        secret:
                          name: basic-auth
                    postgresql:
                      pg_hba:
                        - hostnossl all all 0.0.0.0/0 reject
                        - hostnossl all all ::/0 reject
                    resources:
                      requests:
                        cpu: "{{inputs.parameters.cpuPerMember}}"
                        memory: "{{inputs.parameters.memoryPerMember}}"
                      limits:
                        cpu: "{{inputs.parameters.cpuPerMember}}"
                        memory: "{{inputs.parameters.memoryPerMember}}"
                    storage:
                      resizeInUseVolumes: true
                      size: "{{inputs.parameters.storageSizeGi}}Gi"
                      storageClass: cnpg-gp3-encrypted
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                              - key: omnistrate.com/managed-by
                                operator: In
                                values:
                                - omnistrate
                              - key: topology.kubernetes.io/region
                                operator: In
                                values:
                                - "{{inputs.parameters.region}}"
                              - key: node.kubernetes.io/instance-type
                                operator: In
                                values:
                                - "{{inputs.parameters.instanceType}}"
                              - key: omnistrate.com/resource
                                operator: In
                                values:
                                - "{{inputs.parameters.resourceId}}"
                    managed:
                      services:
                        additional:
                          - selectorType: ro
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-ro"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "reader-{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch
                          - selectorType: rw
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-rw"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch

      # ------------------------------------------------------------------ start (CNPG hibernation off)
      start:
        workflow:
          entrypoint: start
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
          templates:
            - name: start
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              dag:
                tasks:
                  - name: rehydratecluster
                    template: rehydrate-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
            - name: rehydrate-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: patch
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      cnpg.io/hibernation: "off"

      # ------------------------------------------------------------------ stop (CNPG hibernation on; PVCs kept)
      stop:
        workflow:
          entrypoint: stop
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
          templates:
            - name: stop
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              dag:
                tasks:
                  - name: hibernatecluster
                    template: hibernate-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
            - name: hibernate-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: patch
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      cnpg.io/hibernation: "on"

      # ------------------------------------------------------------------ delete
      delete:
        workflow:
          entrypoint: delete
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
          templates:
            - name: delete
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              dag:
                tasks:
                  - name: deletecluster
                    template: delete-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: deletesecret
                    template: delete-secret
                    dependencies:
                      - deletecluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: deleteobjectstore
                    template: delete-object-store
                    dependencies:
                      - deletecluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: deletebackupsecret
                    template: delete-backup-secret
                    dependencies:
                      - deleteobjectstore
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: deletenetworkpolicy
                    template: delete-network-policy
                    dependencies:
                      - deletecluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: deletelimitrange
                    template: delete-limit-range
                    dependencies:
                      - deletecluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: deletequota
                    template: delete-resource-quota
                    dependencies:
                      - deletesecret
                      - deletebackupsecret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
            - name: delete-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: delete
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-secret
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: delete
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: basic-auth
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-object-store
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: delete
                manifest: |
                  apiVersion: barmancloud.cnpg.io/v1
                  kind: ObjectStore
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-s3"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-backup-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: delete
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-s3-credentials"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-network-policy
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: delete
                manifest: |
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: tenant-isolation
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-limit-range
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: delete
                manifest: |
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-resource-quota
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: delete
                manifest: |
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: "{{inputs.parameters.namespace}}"

      # ------------------------------------------------------------------ backup (manual, every 24h, before delete)
      backup:
        outputParameters:
          backupId: "$tasks.createbackupcr.resource.status.backupId"
          backupName: "$tasks.createbackupcr.resource.status.backupName"
        workflow:
          entrypoint: backup
          arguments:
            parameters:
              - name: snapshotId
                value: "{{ $sys.snapshot.id }}"
              - name: snapshotTime
                value: "{{ $sys.snapshot.time }}"
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: numberOfInstances
                value: "{{ $var.numberOfInstances }}"
          templates:
            - name: backup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: snapshotTime
                  - name: namespace
                  - name: instanceId
                  - name: numberOfInstances
              dag:
                tasks:
                  - name: rehydratecluster
                    template: rehydrate-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: numberOfInstances
                          value: "{{inputs.parameters.numberOfInstances}}"
                  - name: createbackupcr
                    template: apply-backup
                    dependencies:
                      - rehydratecluster
                    arguments:
                      parameters:
                        - name: snapshotId
                          value: "{{inputs.parameters.snapshotId}}"
                        - name: snapshotTime
                          value: "{{inputs.parameters.snapshotTime}}"
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
            - name: rehydrate-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: numberOfInstances
              resource:
                action: patch
                successCondition: status.instances == {{inputs.parameters.numberOfInstances}}, status.readyInstances == {{inputs.parameters.numberOfInstances}}
                failureCondition: status.phase == failed
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      cnpg.io/hibernation: "off"
            - name: apply-backup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: snapshotTime
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                successCondition: status.phase == completed
                failureCondition: status.phase == failed
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: "{{inputs.parameters.snapshotId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      omnistrate.io/snapshot-id: "{{inputs.parameters.snapshotId}}"
                      omnistrate.io/snapshot-time: "{{inputs.parameters.snapshotTime}}"
                  spec:
                    method: plugin
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io
                    cluster:
                      name: "{{inputs.parameters.instanceId}}"

      # ------------------------------------------------------------------ restore (new instance, isolated namespace, from a snapshot)
      restore:
        workflow:
          entrypoint: restore
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: restoreSnapshotId
                value: "{{ $sys.restore.snapshotId }}"
              - name: restoreSnapshotTime
                value: "{{ $sys.restore.snapshotTime }}"
              - name: backupId
                value: "{{ $sys.restore.metadata.backupId }}"
              - name: backupName
                value: "{{ $sys.restore.metadata.backupName }}"
              - name: sourceInstanceId
                value: "{{ $sys.sourceInstanceId }}"
              - name: newClusterName
                value: "{{ $sys.targetInstanceId }}"
              - name: restoreServerName
                value: "{{ $sys.targetInstanceId }}-restore-{{ $func.random(string, 8) }}"
              - name: instances
                value: "{{ $var.numberOfInstances }}"
              - name: storageSizeGi
                value: "{{ $var.storageSizeGi }}"
              - name: cpuPerMember
                value: "{{ $var.cpuPerMember }}"
              - name: memoryPerMember
                value: "{{ $var.memoryPerMember }}"
              - name: backupS3BucketName
                value: "{{ $var.backupS3BucketName }}"
              - name: backupS3BucketRegionEncoded
                value: "{{ $func.base64encode($var.backupS3BucketRegion) }}"
              - name: backupS3AccessKeyIdEncoded
                value: "{{ $func.base64encode($var.backupS3AccessKeyId) }}"
              - name: backupS3SecretAccessKeyEncoded
                value: "{{ $func.base64encode($var.backupS3SecretAccessKey) }}"
              - name: externalClusterEndpoint
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $sys.compute.node.instanceType }}"
              - name: resourceId
                value: "{{ $sys.deployment.resourceID }}"
              - name: publicSubnetIds
                value: "{{ $sys.deploymentCell.publicSubnetIDs[*].id }}"
              - name: postgresqlUsername
                value: "{{ $var.postgresqlUsername }}"
              - name: postgresqlUsernameEncoded
                value: "{{ $func.base64encode($var.postgresqlUsername) }}"
              - name: postgresqlPasswordEncoded
                value: "{{ $func.base64encode($var.postgresqlPassword) }}"
          templates:
            - name: restore
              inputs:
                parameters:
                  - name: namespace
                  - name: restoreSnapshotId
                  - name: restoreSnapshotTime
                  - name: backupId
                  - name: backupName
                  - name: sourceInstanceId
                  - name: newClusterName
                  - name: restoreServerName
                  - name: instances
                  - name: storageSizeGi
                  - name: cpuPerMember
                  - name: memoryPerMember
                  - name: backupS3BucketName
                  - name: backupS3BucketRegionEncoded
                  - name: backupS3AccessKeyIdEncoded
                  - name: backupS3SecretAccessKeyEncoded
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
                  - name: postgresqlUsername
                  - name: postgresqlUsernameEncoded
                  - name: postgresqlPasswordEncoded
              dag:
                tasks:
                  - name: applystorageclass
                    template: apply-storage-class
                  - name: applynetworkpolicy
                    template: apply-network-policy
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: applyquota
                    template: apply-resource-quota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: applylimitrange
                    template: apply-limit-range
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                  - name: createsecret
                    template: apply-secret
                    dependencies:
                      - applyquota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: postgresqlUsernameEncoded
                          value: "{{inputs.parameters.postgresqlUsernameEncoded}}"
                        - name: postgresqlPasswordEncoded
                          value: "{{inputs.parameters.postgresqlPasswordEncoded}}"
                  - name: createrestorebackupsecret
                    template: apply-backup-secret
                    dependencies:
                      - applyquota
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: clusterName
                          value: "{{inputs.parameters.newClusterName}}"
                        - name: backupS3AccessKeyIdEncoded
                          value: "{{inputs.parameters.backupS3AccessKeyIdEncoded}}"
                        - name: backupS3SecretAccessKeyEncoded
                          value: "{{inputs.parameters.backupS3SecretAccessKeyEncoded}}"
                        - name: backupS3BucketRegionEncoded
                          value: "{{inputs.parameters.backupS3BucketRegionEncoded}}"
                  - name: createrestoreobjectstore
                    template: apply-restore-object-store
                    dependencies:
                      - createrestorebackupsecret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: newClusterName
                          value: "{{inputs.parameters.newClusterName}}"
                        - name: sourceInstanceId
                          value: "{{inputs.parameters.sourceInstanceId}}"
                        - name: backupS3BucketName
                          value: "{{inputs.parameters.backupS3BucketName}}"
                  - name: createbackupobjectstore
                    template: apply-object-store
                    dependencies:
                      - createrestorebackupsecret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: clusterName
                          value: "{{inputs.parameters.newClusterName}}"
                        - name: backupS3BucketName
                          value: "{{inputs.parameters.backupS3BucketName}}"
                  - name: applycluster
                    template: apply-cluster
                    dependencies:
                      - applystorageclass
                      - applynetworkpolicy
                      - applylimitrange
                      - createsecret
                      - createrestoreobjectstore
                      - createbackupobjectstore
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: restoreSnapshotId
                          value: "{{inputs.parameters.restoreSnapshotId}}"
                        - name: restoreSnapshotTime
                          value: "{{inputs.parameters.restoreSnapshotTime}}"
                        - name: backupId
                          value: "{{inputs.parameters.backupId}}"
                        - name: backupName
                          value: "{{inputs.parameters.backupName}}"
                        - name: sourceInstanceId
                          value: "{{inputs.parameters.sourceInstanceId}}"
                        - name: newClusterName
                          value: "{{inputs.parameters.newClusterName}}"
                        - name: restoreServerName
                          value: "{{inputs.parameters.restoreServerName}}"
                        - name: instances
                          value: "{{inputs.parameters.instances}}"
                        - name: storageSizeGi
                          value: "{{inputs.parameters.storageSizeGi}}"
                        - name: cpuPerMember
                          value: "{{inputs.parameters.cpuPerMember}}"
                        - name: memoryPerMember
                          value: "{{inputs.parameters.memoryPerMember}}"
                        - name: externalClusterEndpoint
                          value: "{{inputs.parameters.externalClusterEndpoint}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: resourceId
                          value: "{{inputs.parameters.resourceId}}"
                        - name: publicSubnetIds
                          value: "{{inputs.parameters.publicSubnetIds}}"
                        - name: postgresqlUsername
                          value: "{{inputs.parameters.postgresqlUsername}}"
            - name: apply-storage-class
              resource:
                action: apply
                manifest: |
                  apiVersion: storage.k8s.io/v1
                  kind: StorageClass
                  metadata:
                    name: cnpg-gp3-encrypted
                  provisioner: ebs.csi.aws.com
                  parameters:
                    type: gp3
                    encrypted: "true"
                    csi.storage.k8s.io/fstype: ext4
                  allowVolumeExpansion: true
                  reclaimPolicy: Delete
                  volumeBindingMode: WaitForFirstConsumer
            - name: apply-network-policy
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: tenant-isolation
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    podSelector: {}
                    policyTypes:
                      - Ingress
                      - Egress
                    ingress:
                      - from:
                          - podSelector: {}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: cnpg-system
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: observability-ns
                        ports:
                          - protocol: TCP
                            port: 9187
                      - from:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                        ports:
                          - protocol: TCP
                            port: 5432
                    egress:
                      - to:
                          - podSelector: {}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                        ports:
                          - protocol: UDP
                            port: 53
                          - protocol: TCP
                            port: 53
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: cnpg-system
                      - to:
                          - ipBlock:
                              cidr: 0.0.0.0/0
                        ports:
                          - protocol: TCP
                            port: 443
            - name: apply-resource-quota
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    hard:
                      requests.cpu: "16"
                      limits.cpu: "16"
                      requests.memory: 48Gi
                      limits.memory: 48Gi
                      requests.storage: 3000Gi
                      persistentvolumeclaims: "12"
                      pods: "20"
                      services: "10"
                      services.loadbalancers: "2"
                      services.nodeports: "4"
                      secrets: "60"
                      configmaps: "30"
            - name: apply-limit-range
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: 500m
                          memory: 512Mi
                        defaultRequest:
                          cpu: 100m
                          memory: 128Mi
                        max:
                          cpu: "2"
                          memory: 8Gi
                      - type: PersistentVolumeClaim
                        min:
                          storage: 1Gi
                        max:
                          storage: 500Gi
            - name: apply-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: postgresqlUsernameEncoded
                  - name: postgresqlPasswordEncoded
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: basic-auth
                    namespace: "{{inputs.parameters.namespace}}"
                  type: kubernetes.io/basic-auth
                  data:
                    username: "{{inputs.parameters.postgresqlUsernameEncoded}}"
                    password: "{{inputs.parameters.postgresqlPasswordEncoded}}"
            - name: apply-backup-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: clusterName
                  - name: backupS3AccessKeyIdEncoded
                  - name: backupS3SecretAccessKeyEncoded
                  - name: backupS3BucketRegionEncoded
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.clusterName}}-s3-credentials"
                    namespace: "{{inputs.parameters.namespace}}"
                  type: Opaque
                  data:
                    ACCESS_KEY_ID: "{{inputs.parameters.backupS3AccessKeyIdEncoded}}"
                    ACCESS_SECRET_KEY: "{{inputs.parameters.backupS3SecretAccessKeyEncoded}}"
                    REGION: "{{inputs.parameters.backupS3BucketRegionEncoded}}"
            - name: apply-restore-object-store
              inputs:
                parameters:
                  - name: namespace
                  - name: newClusterName
                  - name: sourceInstanceId
                  - name: backupS3BucketName
              resource:
                action: apply
                manifest: |
                  apiVersion: barmancloud.cnpg.io/v1
                  kind: ObjectStore
                  metadata:
                    name: "{{inputs.parameters.newClusterName}}-restore-s3"
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    configuration:
                      destinationPath: "s3://{{inputs.parameters.backupS3BucketName}}/{{inputs.parameters.sourceInstanceId}}"
                      s3Credentials:
                        accessKeyId:
                          name: "{{inputs.parameters.newClusterName}}-s3-credentials"
                          key: ACCESS_KEY_ID
                        secretAccessKey:
                          name: "{{inputs.parameters.newClusterName}}-s3-credentials"
                          key: ACCESS_SECRET_KEY
                        region:
                          name: "{{inputs.parameters.newClusterName}}-s3-credentials"
                          key: REGION
                      data:
                        compression: gzip
                        encryption: AES256
                      wal:
                        compression: gzip
                        encryption: AES256
                        maxParallel: 8
            - name: apply-object-store
              inputs:
                parameters:
                  - name: namespace
                  - name: clusterName
                  - name: backupS3BucketName
              resource:
                action: apply
                manifest: |
                  apiVersion: barmancloud.cnpg.io/v1
                  kind: ObjectStore
                  metadata:
                    name: "{{inputs.parameters.clusterName}}-s3"
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    retentionPolicy: "14d"
                    configuration:
                      destinationPath: "s3://{{inputs.parameters.backupS3BucketName}}/{{inputs.parameters.clusterName}}"
                      s3Credentials:
                        accessKeyId:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: ACCESS_KEY_ID
                        secretAccessKey:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: ACCESS_SECRET_KEY
                        region:
                          name: "{{inputs.parameters.clusterName}}-s3-credentials"
                          key: REGION
                      data:
                        compression: gzip
                        encryption: AES256
                      wal:
                        compression: gzip
                        encryption: AES256
                        maxParallel: 8
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: restoreSnapshotId
                  - name: restoreSnapshotTime
                  - name: backupId
                  - name: backupName
                  - name: sourceInstanceId
                  - name: newClusterName
                  - name: restoreServerName
                  - name: instances
                  - name: storageSizeGi
                  - name: cpuPerMember
                  - name: memoryPerMember
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
                  - name: postgresqlUsername
              resource:
                action: apply
                successCondition: status.instances == {{inputs.parameters.instances}}, status.readyInstances == {{inputs.parameters.instances}}
                failureCondition: status.phase == failed
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.newClusterName}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      omnistrate.io/snapshot-id: "{{inputs.parameters.restoreSnapshotId}}"
                      omnistrate.io/snapshot-time: "{{inputs.parameters.restoreSnapshotTime}}"
                      omnistrate.io/backup-id: "{{inputs.parameters.backupId}}"
                      omnistrate.io/backup-name: "{{inputs.parameters.backupName}}"
                      cnpg.io/hibernation: "off"
                  spec:
                    instances: {{inputs.parameters.instances}}
                    enablePDB: true
                    enableSuperuserAccess: false
                    plugins:
                      - name: barman-cloud.cloudnative-pg.io
                        parameters:
                          barmanObjectName: "{{inputs.parameters.newClusterName}}-s3"
                          serverName: "{{inputs.parameters.restoreServerName}}"
                    postgresql:
                      pg_hba:
                        - hostnossl all all 0.0.0.0/0 reject
                        - hostnossl all all ::/0 reject
                    resources:
                      requests:
                        cpu: "{{inputs.parameters.cpuPerMember}}"
                        memory: "{{inputs.parameters.memoryPerMember}}"
                      limits:
                        cpu: "{{inputs.parameters.cpuPerMember}}"
                        memory: "{{inputs.parameters.memoryPerMember}}"
                    storage:
                      resizeInUseVolumes: true
                      size: "{{inputs.parameters.storageSizeGi}}Gi"
                      storageClass: cnpg-gp3-encrypted
                    bootstrap:
                      recovery:
                        source: clusterBackup
                        recoveryTarget:
                          backupID: "{{inputs.parameters.backupId}}"
                    externalClusters:
                      - name: clusterBackup
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: "{{inputs.parameters.newClusterName}}-restore-s3"
                            serverName: "{{inputs.parameters.sourceInstanceId}}"
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                              - key: omnistrate.com/managed-by
                                operator: In
                                values:
                                - omnistrate
                              - key: topology.kubernetes.io/region
                                operator: In
                                values:
                                - "{{inputs.parameters.region}}"
                              - key: node.kubernetes.io/instance-type
                                operator: In
                                values:
                                - "{{inputs.parameters.instanceType}}"
                              - key: omnistrate.com/resource
                                operator: In
                                values:
                                - "{{inputs.parameters.resourceId}}"
                    managed:
                      roles:
                        - name: "{{inputs.parameters.postgresqlUsername}}"
                          ensure: present
                          login: true
                          passwordSecret:
                            name: basic-auth
                      services:
                        additional:
                          - selectorType: ro
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.newClusterName}}-cluster-ro"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "reader-{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.newClusterName}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch
                          - selectorType: rw
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.newClusterName}}-cluster-rw"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.newClusterName}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch

      # ------------------------------------------------------------------ deleteBackup (manual delete and retention cleanup)
      deleteBackup:
        workflow:
          entrypoint: deleteBackup
          arguments:
            parameters:
              - name: snapshotId
                value: "{{ $sys.snapshot.id }}"
              - name: namespace
                value: "{{ $sys.namespace }}"
          templates:
            - name: deleteBackup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: namespace
              dag:
                tasks:
                  - name: deletebackupcr
                    template: delete-backup
                    arguments:
                      parameters:
                        - name: snapshotId
                          value: "{{inputs.parameters.snapshotId}}"
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
            - name: delete-backup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: namespace
              resource:
                action: delete
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: "{{inputs.parameters.snapshotId}}"
                    namespace: "{{inputs.parameters.namespace}}"
