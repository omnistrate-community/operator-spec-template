# yaml-language-server: $schema=https://api.omnistrate.dev/2022-09-01-00/schema/service-spec-schema.json
name: Postgres Operator # Service Plan Name
deployment:
  hostedDeployment:
    AwsAccountId: "339713121445"
    AWSBootstrapRoleAccountArn: "arn:aws:iam::339713121445:role/omnistrate-bootstrap-role"
tenancyType: CUSTOM_TENANCY
features:
  INTERNAL:
    logs: # Omnistrate native
  CUSTOMER:
    logs: # Omnistrate native

services:
  - name: CNPG
    compute:
      instanceTypes:
        - apiParam: instanceType
          cloudProvider: aws
    apiParameters:
      - key: instanceType
        description: Instance Type
        name: Instance Type
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: "t3.medium"
      - key: postgresqlPassword
        description: Default DB Password
        name: Password
        type: Password
        modifiable: false
        required: true
        export: true
      - key: postgresqlUsername
        description: Username
        name: Default DB Username
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "app"
      - key: postgresqlDatabase
        description: Default Database Name
        name: Default Database Name
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: "app"
      - key: numberOfInstances
        description: Total Number of Instances
        name: Total Number of Instances
        type: Float64
        modifiable: true
        required: false
        export: true
        defaultValue: "1"
        limits:
          min: 1
      - key: storageSize
        description: Storage size for PostgreSQL data
        name: Storage Size
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: "20Gi"
      - key: backupMethod
        description: CloudNativePG backup method to use for manual, periodic, and delete-triggered backups
        name: Backup Method
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: "barmanObjectStore"
    endpointConfiguration:
      writer:
        host: "$sys.network.externalClusterEndpoint"
        ports:
          - 5432
        primary: true
        networkingType: PUBLIC
      reader:
        host: "reader-{{ $sys.network.externalClusterEndpoint }}"
        ports:
          - 5432
        primary: false
        networkingType: PUBLIC
        
    operatorCRDConfiguration:
      # Deprecated fields intentionally omitted:
      # template, supplementalFiles.
      # CNPG lifecycle is managed by systemWorkflows.create/update/delete.
      readinessConditions:
        "$var._crd.status.phase": "Cluster in healthy state"
        '$var._crd.status.conditions[?(@.type=="Ready")].status': "True"

      outputParameters:
        "Postgres Container Image": "$var._crd.status.image"
        "Status": "$var._crd.status.phase"
        "Topology": "$var._crd.status.topology"

      helmChartDependencies:
        - chartName: cloudnative-pg
          chartVersion: 0.26.0
          chartRepoName: cnpg
          chartRepoURL: https://cloudnative-pg.github.io/charts

    capabilities:    
      backupConfiguration:
        backupRetentionInDays: 7
        backupPeriodInHours: 24
        snapshotBeforeDeletion: true

    systemWorkflows:

      create:
        workflow:
          entrypoint: create
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: postgresqlUsername
                value: "{{ $var.postgresqlUsername }}"
              - name: postgresqlDatabase
                value: "{{ $var.postgresqlDatabase }}"
              - name: postgresqlUsernameEncoded
                value: "{{ $func.base64encode($var.postgresqlUsername) }}"
              - name: postgresqlPasswordEncoded
                value: "{{ $func.base64encode($var.postgresqlPassword) }}"
              - name: numberOfInstances
                value: "{{ $var.numberOfInstances }}"
              - name: storageSize
                value: "{{ $var.storageSize }}"
              - name: externalClusterEndpoint
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $sys.compute.node.instanceType }}"
              - name: resourceId
                value: "{{ $sys.deployment.resourceID }}"
              - name: publicSubnetIds
                value: "{{ $sys.deploymentCell.publicSubnetIDs[*].id }}"
          templates:
            - name: create
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: postgresqlUsernameEncoded
                  - name: postgresqlPasswordEncoded
                  - name: numberOfInstances
                  - name: storageSize
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              dag:
                tasks:
                  - name: createsecret
                    template: apply-secret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: postgresqlUsernameEncoded
                          value: "{{inputs.parameters.postgresqlUsernameEncoded}}"
                        - name: postgresqlPasswordEncoded
                          value: "{{inputs.parameters.postgresqlPasswordEncoded}}"
                  - name: applycluster
                    template: apply-cluster
                    dependencies:
                      - createsecret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: postgresqlUsername
                          value: "{{inputs.parameters.postgresqlUsername}}"
                        - name: postgresqlDatabase
                          value: "{{inputs.parameters.postgresqlDatabase}}"
                        - name: numberOfInstances
                          value: "{{inputs.parameters.numberOfInstances}}"
                        - name: storageSize
                          value: "{{inputs.parameters.storageSize}}"
                        - name: externalClusterEndpoint
                          value: "{{inputs.parameters.externalClusterEndpoint}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: resourceId
                          value: "{{inputs.parameters.resourceId}}"
                        - name: publicSubnetIds
                          value: "{{inputs.parameters.publicSubnetIds}}"
            - name: apply-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: postgresqlUsernameEncoded
                  - name: postgresqlPasswordEncoded
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: basic-auth
                    namespace: "{{inputs.parameters.namespace}}"
                  type: kubernetes.io/basic-auth
                  data:
                    username: "{{inputs.parameters.postgresqlUsernameEncoded}}"
                    password: "{{inputs.parameters.postgresqlPasswordEncoded}}"
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: numberOfInstances
                  - name: storageSize
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              resource:
                action: apply
                successCondition: status.conditions.#(type=="Ready").status == True
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    enablePDB: true
                    bootstrap:
                      initdb:
                        owner: "{{inputs.parameters.postgresqlUsername}}"
                        database: "{{inputs.parameters.postgresqlDatabase}}"
                        secret:
                          name: basic-auth
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                              - key: omnistrate.com/managed-by
                                operator: In
                                values:
                                - omnistrate
                              - key: topology.kubernetes.io/region
                                operator: In
                                values:
                                - "{{inputs.parameters.region}}"
                              - key: node.kubernetes.io/instance-type
                                operator: In
                                values:
                                - "{{inputs.parameters.instanceType}}"
                              - key: omnistrate.com/resource
                                operator: In
                                values:
                                - "{{inputs.parameters.resourceId}}"
                    instances: {{inputs.parameters.numberOfInstances}}
                    storage:
                      resizeInUseVolumes: true
                      size: "{{inputs.parameters.storageSize}}"
                      storageClass: gp3
                    managed:
                      services:
                        additional:
                          - selectorType: ro
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-ro"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "reader-{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch
                          - selectorType: rw
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-rw"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch

      update:
        workflow:
          entrypoint: update
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: postgresqlUsername
                value: "{{ $var.postgresqlUsername }}"
              - name: postgresqlDatabase
                value: "{{ $var.postgresqlDatabase }}"
              - name: numberOfInstances
                value: "{{ $var.numberOfInstances }}"
              - name: storageSize
                value: "{{ $var.storageSize }}"
              - name: externalClusterEndpoint
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $sys.compute.node.instanceType }}"
              - name: resourceId
                value: "{{ $sys.deployment.resourceID }}"
              - name: publicSubnetIds
                value: "{{ $sys.deploymentCell.publicSubnetIDs[*].id }}"
          templates:
            - name: update
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: numberOfInstances
                  - name: storageSize
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              dag:
                tasks:
                  - name: applycluster
                    template: apply-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: postgresqlUsername
                          value: "{{inputs.parameters.postgresqlUsername}}"
                        - name: postgresqlDatabase
                          value: "{{inputs.parameters.postgresqlDatabase}}"
                        - name: numberOfInstances
                          value: "{{inputs.parameters.numberOfInstances}}"
                        - name: storageSize
                          value: "{{inputs.parameters.storageSize}}"
                        - name: externalClusterEndpoint
                          value: "{{inputs.parameters.externalClusterEndpoint}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: resourceId
                          value: "{{inputs.parameters.resourceId}}"
                        - name: publicSubnetIds
                          value: "{{inputs.parameters.publicSubnetIds}}"
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: postgresqlUsername
                  - name: postgresqlDatabase
                  - name: numberOfInstances
                  - name: storageSize
                  - name: externalClusterEndpoint
                  - name: region
                  - name: instanceType
                  - name: resourceId
                  - name: publicSubnetIds
              resource:
                action: apply
                successCondition: status.conditions.#(type=="Ready").status == True
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                  spec:
                    enablePDB: true
                    bootstrap:
                      initdb:
                        owner: "{{inputs.parameters.postgresqlUsername}}"
                        database: "{{inputs.parameters.postgresqlDatabase}}"
                        secret:
                          name: basic-auth
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                              - key: omnistrate.com/managed-by
                                operator: In
                                values:
                                - omnistrate
                              - key: topology.kubernetes.io/region
                                operator: In
                                values:
                                - "{{inputs.parameters.region}}"
                              - key: node.kubernetes.io/instance-type
                                operator: In
                                values:
                                - "{{inputs.parameters.instanceType}}"
                              - key: omnistrate.com/resource
                                operator: In
                                values:
                                - "{{inputs.parameters.resourceId}}"
                    instances: {{inputs.parameters.numberOfInstances}}
                    storage:
                      resizeInUseVolumes: true
                      size: "{{inputs.parameters.storageSize}}"
                      storageClass: gp3
                    managed:
                      services:
                        additional:
                          - selectorType: ro
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-ro"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "reader-{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch
                          - selectorType: rw
                            serviceTemplate:
                              metadata:
                                name: "{{inputs.parameters.instanceId}}-cluster-rw"
                                annotations:
                                    external-dns.alpha.kubernetes.io/hostname: "{{inputs.parameters.externalClusterEndpoint}}"
                                    external-dns.alpha.kubernetes.io/ttl: "60"
                                    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "omnistrate.com/resource={{inputs.parameters.resourceId}},omnistrate.com/instance={{inputs.parameters.instanceId}},omnistrate.com/managed-by=omnistrate"
                                    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
                                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                                    service.beta.kubernetes.io/aws-load-balancer-subnets: "{{inputs.parameters.publicSubnetIds}}"
                                    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                                    service.beta.kubernetes.io/aws-load-balancer-target-node-labels: omnistrate.com/managed-by=omnistrate
                                    service.beta.kubernetes.io/aws-load-balancer-type: external
                                    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
                                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
                              spec:
                                type: LoadBalancer
                            updateStrategy: patch

      delete:
        workflow:
          entrypoint: delete
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
          templates:
            - name: delete
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              dag:
                tasks:
                  - name: deletecluster
                    template: delete-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: deletesecret
                    template: delete-secret
                    dependencies:
                      - deletecluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
            - name: delete-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: delete
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: delete-secret
              inputs:
                parameters:
                  - name: namespace
              resource:
                action: delete
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: basic-auth
                    namespace: "{{inputs.parameters.namespace}}"

      backup:

        workflow:
          entrypoint: backup
          arguments:
            parameters:
              - name: snapshotId
                value: "{{ $sys.snapshot.id }}"
              - name: snapshotTime
                value: "{{ $sys.snapshot.time }}"
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: method
                value: "{{ $var.backupMethod }}"
          templates:
            - name: backup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: snapshotTime
                  - name: namespace
                  - name: instanceId
                  - name: method
              dag:
                tasks:
                  - name: createBackupCR
                    template: apply-backup
                    arguments:
                      parameters:
                        - name: snapshotId
                          value: "{{inputs.parameters.snapshotId}}"
                        - name: snapshotTime
                          value: "{{inputs.parameters.snapshotTime}}"
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: method
                          value: "{{inputs.parameters.method}}"
            - name: apply-backup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: snapshotTime
                  - name: namespace
                  - name: instanceId
                  - name: method
              resource:
                action: apply
                successCondition: status.phase == completed
                failureCondition: status.phase == failed
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: "{{inputs.parameters.snapshotId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      omnistrate.io/snapshot-id: "{{inputs.parameters.snapshotId}}"
                      omnistrate.io/snapshot-time: "{{inputs.parameters.snapshotTime}}"
                  spec:
                    method: "{{inputs.parameters.method}}"
                    cluster:
                      name: "{{inputs.parameters.instanceId}}"

      restore:
        workflow:
          entrypoint: restore
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: restoreSnapshotId
                value: "{{ $sys.restore.snapshotId }}"
              - name: restoreSnapshotTime
                value: "{{ $sys.restore.snapshotTime }}"
              - name: newClusterName
                value: "{{ $sys.targetInstanceId }}"
              - name: instances
                value: "{{ $var.numberOfInstances }}"
              - name: storageSize
                value: "{{ $var.storageSize }}"
          templates:
            - name: restore
              inputs:
                parameters:
                  - name: namespace
                  - name: restoreSnapshotId
                  - name: restoreSnapshotTime
                  - name: newClusterName
                  - name: instances
                  - name: storageSize
              dag:
                tasks:
                  - name: createCluster
                    template: apply-cluster
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: restoreSnapshotId
                          value: "{{inputs.parameters.restoreSnapshotId}}"
                        - name: restoreSnapshotTime
                          value: "{{inputs.parameters.restoreSnapshotTime}}"
                        - name: newClusterName
                          value: "{{inputs.parameters.newClusterName}}"
                        - name: instances
                          value: "{{inputs.parameters.instances}}"
                        - name: storageSize
                          value: "{{inputs.parameters.storageSize}}"
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: restoreSnapshotId
                  - name: restoreSnapshotTime
                  - name: newClusterName
                  - name: instances
                  - name: storageSize
              resource:
                action: apply
                successCondition: status.conditions.#(type=="Ready").status == True
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: "{{inputs.parameters.newClusterName}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      omnistrate.io/snapshot-id: "{{inputs.parameters.restoreSnapshotId}}"
                      omnistrate.io/snapshot-time: "{{inputs.parameters.restoreSnapshotTime}}"
                  spec:
                    instances: {{inputs.parameters.instances}}
                    storage:
                      size: "{{inputs.parameters.storageSize}}"
                    bootstrap:
                      recovery:
                        backup:
                          name: "{{inputs.parameters.restoreSnapshotId}}"

      deleteBackup:
        workflow:
          entrypoint: deleteBackup
          arguments:
            parameters:
              - name: snapshotId
                value: "{{ $sys.snapshot.id }}"
              - name: snapshotTime
                value: "{{ $sys.snapshot.time }}"
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
          templates:
            - name: deleteBackup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: snapshotTime
                  - name: namespace
                  - name: instanceId
              dag:
                tasks:
                  - name: deleteBackupCR
                    template: delete-backup
                    arguments:
                      parameters:
                        - name: snapshotId
                          value: "{{inputs.parameters.snapshotId}}"
                        - name: snapshotTime
                          value: "{{inputs.parameters.snapshotTime}}"
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
            - name: delete-backup
              inputs:
                parameters:
                  - name: snapshotId
                  - name: snapshotTime
                  - name: namespace
                  - name: instanceId
              resource:
                action: delete
                manifest: |
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: "{{inputs.parameters.snapshotId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    annotations:
                      omnistrate.io/snapshot-id: "{{inputs.parameters.snapshotId}}"
                      omnistrate.io/snapshot-time: "{{inputs.parameters.snapshotTime}}"

    # Custom operator workflows with inline workflow definitions
    customWorkflows:
    - verb: failover
      displayName: Force failover
      description: Delete the current primary pod and let CloudNativePG promote the most suitable replica.
      scope:
        - fleet
      apiParameters:
        - key: primaryPodName
          displayName: Primary Pod Name
          description: Name of the current CloudNativePG primary pod to delete.
          type: String
          required: true
      workflow:
        entrypoint: failover
        arguments:
          parameters:
            - name: namespace
              value: "{{ $sys.namespace }}"
            - name: instanceId
              value: "{{ $sys.instanceId }}"
            - name: primaryPodName
              value: "{{ $var.primaryPodName }}"
        templates:
          - name: failover
            inputs:
              parameters:
                - name: namespace
                - name: instanceId
                - name: primaryPodName
            dag:
              tasks:
                - name: deletePrimaryPod
                  template: delete-primary-pod
                  arguments:
                    parameters:
                      - name: namespace
                        value: "{{inputs.parameters.namespace}}"
                      - name: instanceId
                        value: "{{inputs.parameters.instanceId}}"
                      - name: primaryPodName
                        value: "{{inputs.parameters.primaryPodName}}"
          - name: delete-primary-pod
            inputs:
              parameters:
                - name: namespace
                - name: instanceId
                - name: primaryPodName
            resource:
              action: delete
              manifest: |
                apiVersion: v1
                kind: Pod
                metadata:
                  name: "{{inputs.parameters.primaryPodName}}"
                  namespace: "{{inputs.parameters.namespace}}"
                  labels:
                    postgresql: "{{inputs.parameters.instanceId}}"
